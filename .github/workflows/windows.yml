name: Windows build and checks
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - name: Publish FlipFlop (win-x64, self-contained)
        shell: pwsh
        run: |
          dotnet restore windows/Nashi.Windows --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish windows/Nashi.Windows -c Release --no-restore -o build/windows/FlipFlop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Engine and security checks with real FFmpeg exports
        shell: pwsh
        env:
          NASHI_VERIFY_DOWNLOAD_TOOLS: '1'
          NASHI_VERIFY_TOOLS_DIRECTORY: '${{ runner.temp }}\Nashi-Test-Tools'
        run: |
          dotnet run --project windows/Nashi.Verify -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Start the app and capture every screen (light and dark, Turkish)
        shell: pwsh
        run: |
          foreach ($mode in 'light', 'dark') {
            $out = Join-Path $env:GITHUB_WORKSPACE "build/ui-audit-$mode"
            New-Item -ItemType Directory -Force $out | Out-Null
            $p = Start-Process -FilePath (Resolve-Path build/windows/FlipFlop/FlipFlop.exe) -ArgumentList '--ui-audit', $out, '--appearance', $mode, '--language', 'tr' -PassThru
            if (-not $p.WaitForExit(600000)) { $p.Kill($true); throw "UI audit ($mode) timed out" }
            if ($p.ExitCode -ne 0) { throw "UI audit ($mode) failed with exit code $($p.ExitCode)" }
          }
      - name: Package ZIP and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/release | Out-Null
          Compress-Archive -Path build/windows/FlipFlop/* -DestinationPath build/release/FlipFlop-Windows-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash build/release/FlipFlop-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  FlipFlop-Windows-x64.zip" | Set-Content build/release/SHA256SUMS.txt -Encoding ascii
          Write-Host "SHA-256: $hash"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: FlipFlop-Windows-x64
          path: build/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ui-audit
          path: |
            build/ui-audit-light
            build/ui-audit-dark
          if-no-files-found: warn
  # Tag pushes only. Runs apart from the build job so the signing key and write access
  # never touch the steps that run downloaded tools and the app itself.
  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: FlipFlop-Windows-x64
          path: release
      - name: Sign the ZIP, write the update feed, publish the release
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SIGNING_KEY) { throw 'The UPDATE_SIGNING_KEY secret is not set.' }
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Tag $($env:TAG) is not vMAJOR.MINOR.PATCH" }
          $version = $Matches[1]
          $zip = (Resolve-Path release/FlipFlop-Windows-x64.zip).Path
          # The ZIP must really contain the version the tag claims.
          $probe = Join-Path $env:RUNNER_TEMP 'probe'
          New-Item -ItemType Directory -Force $probe | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try { [IO.Compression.ZipFileExtensions]::ExtractToFile($archive.GetEntry('FlipFlop.dll'), (Join-Path $probe 'FlipFlop.dll'), $true) } finally { $archive.Dispose() }
          $built = [Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $probe 'FlipFlop.dll')).FileVersion
          if ($built -ne "$version.0") { throw "Tag says $version but the build is $built" }
          $openssl = 'C:\Program Files\Git\usr\bin\openssl.exe'
          $key = Join-Path $env:RUNNER_TEMP 'update-key.pem'
          $pub = Join-Path $env:RUNNER_TEMP 'update-pub.pem'
          $der = Join-Path $env:RUNNER_TEMP 'update-pub.der'
          $sig = Join-Path $env:RUNNER_TEMP 'update.sig'
          [IO.File]::WriteAllText($key, $env:SIGNING_KEY.Trim() + "`n")
          try {
            & $openssl pkey -in $key -pubout -out $pub
            if ($LASTEXITCODE -ne 0) { throw 'The signing key is not a valid private key.' }
            & $openssl pkey -in $key -pubout -outform DER -out $der
            if ($LASTEXITCODE -ne 0) { throw 'Could not export the public key.' }
            # The key in the secret must be the one compiled into the app, or no installed copy could trust the update.
            $bytes = [IO.File]::ReadAllBytes($der)
            $rawPublic = [Convert]::ToBase64String($bytes[($bytes.Length - 32)..($bytes.Length - 1)])
            $source = Get-Content windows/Nashi.Core/PublicUpdates.cs -Raw
            if (-not $source.Contains("PublicKey=`"$rawPublic`"")) { throw 'The signing key does not match PublicUpdates.PublicKey.' }
            & $openssl pkeyutl -sign -rawin -inkey $key -in $zip -out $sig
            if ($LASTEXITCODE -ne 0) { throw 'Signing failed.' }
            & $openssl pkeyutl -verify -rawin -pubin -inkey $pub -in $zip -sigfile $sig
            if ($LASTEXITCODE -ne 0) { throw 'The fresh signature does not verify.' }
          } finally { Remove-Item $key -Force -ErrorAction SilentlyContinue }
          $feed = [ordered]@{
            Version = $version
            Url = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/$($env:TAG)/FlipFlop-Windows-x64.zip"
            Length = (Get-Item $zip).Length
            EdSignature = [Convert]::ToBase64String([IO.File]::ReadAllBytes($sig))
          } | ConvertTo-Json
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'release/windows-update.json'), $feed, (New-Object Text.UTF8Encoding($false)))
          Get-Content release/windows-update.json
          gh release create $env:TAG --verify-tag --title "FlipFlop $version" --generate-notes release/FlipFlop-Windows-x64.zip release/SHA256SUMS.txt release/windows-update.json
          if ($LASTEXITCODE -ne 0) { throw 'Creating the release failed.' }
